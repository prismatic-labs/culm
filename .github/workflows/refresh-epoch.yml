name: Refresh Epoch metrics

on:
  schedule:
    # 06:00 UTC on the 1st of each month
    - cron: '0 6 1 * *'
  workflow_dispatch:

# contents:write pushes the bot/epoch-refresh review branch only.
# main is protected; the monthly refresh is merged by a human.
permissions:
  contents: write

concurrency:
  group: culm-epoch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Epoch AI metrics
        run: npm run refresh:apis

      - name: Rebuild dataset snapshot and verify
        run: |
          npm run build
          npm run test

      - name: Push review branch if data changed
        run: |
          FILES="src/data/auto/epoch-metrics.json public/data/concentration.json"
          if git diff --quiet -- $FILES; then
            echo "Epoch metrics unchanged; nothing to review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/epoch-refresh
          git add $FILES
          git commit -m "chore(data): refresh Epoch AI accelerator and cluster metrics"
          git push -f origin bot/epoch-refresh
          {
            echo "### Epoch metrics refresh ready for review"
            echo
            echo "Pushed to \`bot/epoch-refresh\`. Build and tests passed before this step."
            echo
            echo "[Open a pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...bot/epoch-refresh?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"
